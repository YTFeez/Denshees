# Denshees — Hostinger VPS (accès via IP:3000)
# Usage:
#   cp .env.hostinger.example .env
#   docker compose -f docker-compose.hostinger.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-denshees}
      POSTGRES_DB: denshees
    volumes:
      - postgres_data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d denshees"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - denshees

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - denshees

  backend:
    build:
      context: .
      dockerfile: apps/denshees-backend/Dockerfile.monorepo
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8100
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-denshees}@postgres:5432/denshees
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8100:8100"
    networks:
      - denshees

  frontend:
    build:
      context: .
      dockerfile: apps/denshees-frontend/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8100
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-denshees}@postgres:5432/denshees
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${API_KEY}
      AGENT_URL: ${AGENT_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SUPPORT_NOTIFY_EMAILS: ${SUPPORT_NOTIFY_EMAILS:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - denshees

networks:
  denshees:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
